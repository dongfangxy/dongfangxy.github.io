<footer class="site-footer">
  <div class="footer-inner">
    <span>Chengxi Zhang</span>
    <span aria-hidden="true">·</span>
    <span>Site last updated on {{ site.time | date: '%B %d, %Y' }}</span>
  </div>
</footer>

<!-- Scroll-to-top button -->
<button class="scroll-top" id="scrollTopBtn" aria-label="Back to top" title="Back to top">
  &#9650;
</button>

<script>
  // --- Navbar shadow on scroll ---
  (function () {
    var menu = document.getElementById('layout-menu');
    if (!menu) return;
    var scrollClass = 'scrolled';
    function onScroll() {
      if (window.scrollY > 8) {
        menu.classList.add(scrollClass);
      } else {
        menu.classList.remove(scrollClass);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();

  // --- Scroll-to-top button ---
  (function () {
    var btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    function toggle() {
      if (window.scrollY > 500) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }
    window.addEventListener('scroll', toggle, { passive: true });
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    toggle();
  })();

  // --- Google Analytics ---
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-46742675-1', 'auto');
  ga('send', 'pageview');
</script>
